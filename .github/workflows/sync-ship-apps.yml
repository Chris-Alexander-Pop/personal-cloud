# Keep the ship workflow_dispatch dropdown in sync with GitHub repos that
# have a root .personal-cloud.yaml. GitHub cannot fill choice inputs at
# click time, so this job rewrites the YAML and pushes it.
#
# GITHUB_TOKEN cannot list other private repos, and GitHub rejects its
# pushes to .github/workflows. Checkout, gh, and git push all use the
# GH_TOKEN secret: a user token with the repo and workflow scopes.
name: sync-ship-apps

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [ship]
    types: [completed]

concurrency:
  group: sync-ship-apps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_TOKEN secret is unset." >&2
            echo "Add a PAT with the repo and workflow scopes." >&2
            echo "repo lists private app repos. workflow is required to push .github/workflows/ship.yml." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Refresh ship dropdown
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: ./scripts/sync-ship-apps.sh

      - name: Commit if the app list changed
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          scopes="$(gh api -i user | awk 'tolower($0) ~ /^x-oauth-scopes:/ { sub(/\r$/,""); sub(/^[^:]*: */,""); print }')"
          if [ -n "$scopes" ]; then
            found=0
            IFS=',' read -ra parts <<<"$scopes"
            for scope in "${parts[@]}"; do
              scope="${scope#"${scope%%[![:space:]]*}"}"
              scope="${scope%"${scope##*[![:space:]]}"}"
              if [ "$scope" = "workflow" ]; then
                found=1
              fi
            done
            if [ "$found" -ne 1 ]; then
              echo "GH_TOKEN is missing the workflow scope (have: ${scopes})." >&2
              echo "That scope is required to push .github/workflows/ship.yml." >&2
              exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ship.yml
          if git diff --cached --quiet; then
            echo "ship dropdown unchanged"
            exit 0
          fi
          git commit -m "Refresh ship workflow app dropdown from GitHub manifests."
          git push
