# Run from the GitHub mobile/web UI: Actions → ship → Run workflow.
# No app clone on your phone. Uses the existing Woodpecker ship pipeline.
#
# The `repo` dropdown is generated by scripts/sync-ship-apps.sh from GitHub
# repos that have a root .personal-cloud.yaml. GitHub cannot populate choice
# inputs at click time — pick "other" for a first ship, then the sync job
# adds it after a successful run (or the daily schedule).
name: ship

on:
  workflow_dispatch:
    inputs:
      repo:
        description: App to ship
        required: true
        type: choice
        options:
          # BEGIN SHIP_APPS
          - Animal
          - devote
          - gvl
          - macrofactor-mcp
          - music-serve
          - ro-prayers-app
          - trickers-third-eye
          # END SHIP_APPS
          - other
      other_repo:
        description: Repo name if you picked other (music-serve or owner/music-serve)
        required: false
        type: string
        default: ""
      ref:
        description: Git ref to ship (empty = default branch)
        required: false
        type: string
        default: ""
      exposure:
        description: Force public or private (empty = use the app manifest)
        required: false
        type: string
        default: ""
      wait:
        description: Wait for the Woodpecker pipeline
        required: false
        type: boolean
        default: true

jobs:
  ship:
    uses: ./.github/workflows/ship-reusable.yml
    with:
      repo: ${{ inputs.repo != 'other' && inputs.repo || inputs.other_repo }}
      ref: ${{ inputs.ref }}
      exposure: ${{ inputs.exposure }}
      wait: ${{ inputs.wait }}
    secrets:
      WOODPECKER_URL: ${{ secrets.WOODPECKER_URL }}
      WOODPECKER_TOKEN: ${{ secrets.WOODPECKER_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TAILNET_BASE: ${{ secrets.TAILNET_BASE }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
