# Fail the build if a real Tailscale CGNAT or RFC1918 address lands in the tree.
# Allowed placeholders (they do not match the numeric patterns below):
#   100.x.x.x, example.ts.net, tail123.ts.net, 127.0.0.1, 0.0.0.0
name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    name: no live tailnet or RFC1918
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep tracked files for private addresses
        run: |
          set -euo pipefail
          # CGNAT 100.64/10 (second octet 64–127) and RFC1918 (10/8, 172.16/12, 192.168/16).
          pattern='100\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|(^|[^0-9])10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]{1,3}\.[0-9]{1,3}'
          hits="$(git grep -nIE "$pattern" -- . || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "secret-scan: found a real tailnet or RFC1918 address (placeholders 100.x.x.x, example.ts.net, tail123.ts.net, 127.0.0.1, 0.0.0.0 are allowed)." >&2
            exit 1
          fi
          echo "secret-scan: clean"
